<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weka Upya Nenosiri - STORE</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
        import { getAuth, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyC-8IRm50zrlHWjG-jpfzrh0YtprC1Tsaw",
            authDomain: "product-store-6a651.firebaseapp.com",
            projectId: "product-store-6a651",
            storageBucket: "product-store-6a651.firebasestorage.app",
            messagingSenderId: "379449735108",
            appId: "1:379449735108:web:bf0bb51d68f28273cdd691"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // DOM Elements
        const resetForm = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const resetBtn = document.getElementById('resetBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const backToLogin = document.getElementById('backToLogin');

        // Check if user is already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = '/';
            }
        });

        // Reset Form Submit
        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();

            // Validate
            if (!email) {
                showError('❌ Tafadhali ingiza barua pepe yako');
                emailInput.focus();
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showError('❌ Tafadhali ingiza barua pepe sahihi');
                return;
            }

            // Show loading
            resetBtn.disabled = true;
            resetBtn.textContent = '⏳ Inatuma...';
            hideError();
            hideSuccess();

            try {
                await sendPasswordResetEmail(auth, email, {
                    url: window.location.origin + '/login.html',
                    handleCodeInApp: false
                });
                
                showSuccess(`
                    ✅ Barua ya kuweka upya nenosiri imetumwa kwa ${email}!
                    <br><small>Tafadhali angalia spam folder yako kama haujaipokea.</small>
                `);
                
                emailInput.value = '';
                resetBtn.textContent = '📧 Tumwa Tena';
                resetBtn.disabled = false;

            } catch (error) {
                console.error('Password reset error:', error);
                
                switch(error.code) {
                    case 'auth/user-not-found':
                        showError('❌ Hakuna akaunti inayotumia barua pepe hii');
                        break;
                    case 'auth/invalid-email':
                        showError('❌ Barua pepe si sahihi');
                        break;
                    case 'auth/too-many-requests':
                        showError('❌ Majaribio mengi sana. Jaribu baadaye.');
                        break;
                    default:
                        showError('❌ Imeshindwa kutuma barua. Jaribu tena.');
                }
                
                resetBtn.disabled = false;
                resetBtn.textContent = '📧 Tuma Barua';
            }
        });

        // Helper Functions
        function showError(message) {
            errorMessage.innerHTML = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.innerHTML = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        function hideSuccess() {
            successMessage.style.display = 'none';
        }

        // Enter key support
        emailInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                resetForm.dispatchEvent(new Event('submit'));
            }
        });

        console.log('✅ Forgot Password page initialized with Firebase');
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .reset-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .reset-header .icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .reset-header h1 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.3rem;
        }

        .reset-header p {
            color: #888;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .reset-header p span {
            color: #667eea;
            font-weight: 600;
        }

        /* Messages */
        .message {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            display: none;
            line-height: 1.5;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .message.success small {
            display: block;
            margin-top: 0.3rem;
            opacity: 0.8;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }

        .form-group label .required {
            color: #ff4444;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .input-group input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group input.error {
            border-color: #ff4444;
        }

        .input-group .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #888;
        }

        .input-group input[type="email"] {
            padding-left: 2.8rem;
        }

        .reset-btn {
            width: 100%;
            padding: 0.9rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .reset-btn:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link a:hover {
            color: #5a67d8;
            text-decoration: underline;
        }

        /* Info Box */
        .info-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #667eea;
        }

        .info-box p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .info-box p strong {
            color: #333;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #888;
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .divider::before {
            margin-right: 1rem;
        }

        .divider::after {
            margin-left: 1rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .reset-container {
                padding: 1.5rem;
            }

            .reset-header h1 {
                font-size: 1.5rem;
            }

            .reset-header .icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <span class="icon">🔑</span>
            <h1>Weka Upya <span>Nenosiri</span></h1>
            <p>Ingiza barua pepe yako ili tukupe link ya kuweka upya nenosiri</p>
        </div>

        <!-- Info Box -->
        <div class="info-box">
            <p>
                <strong>💡 Vidokezo:</strong><br>
                • Tuma barua pepe pekee uliyojisajili nayo<br>
                • Angalia <strong>spam</strong> folder kama hujaipokea<br>
                • Link itakua halali kwa <strong>dakika 60</strong>
            </p>
        </div>

        <!-- Messages -->
        <div class="message error" id="errorMessage"></div>
        <div class="message success" id="successMessage"></div>

        <!-- Reset Form -->
        <form id="resetForm">
            <div class="form-group">
                <label>Barua Pepe <span class="required">*</span></label>
                <div class="input-group">
                    <span class="input-icon">📧</span>
                    <input type="email" id="email" placeholder="mteja@email.com" required autocomplete="email">
                </div>
            </div>

            <button type="submit" class="reset-btn" id="resetBtn">📧 Tuma Barua</button>
        </form>

        <div class="divider">au</div>

        <div class="back-link">
            <a href="/login.html" id="backToLogin">← Rudi Kwenye Kuingia</a>
        </div>
    </div>

    <script>
        // Quick fix - ensure messages are hidden on page load
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('successMessage').style.display = 'none';
    </script>
</body>
</html>
