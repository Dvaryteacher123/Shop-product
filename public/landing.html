<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORE - Welcome</title>
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; outline: none; font-family: inherit; }

        /* ===== ANIMATED BACKGROUND ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .glow-overlay {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(102, 126, 234, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(118, 75, 162, 0.06) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
            animation: glowFloat 20s ease-in-out infinite alternate;
        }

        @keyframes glowFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-2%, -1%) scale(1.02); }
            66% { transform: translate(2%, 1%) scale(0.98); }
            100% { transform: translate(-1%, -2%) scale(1.01); }
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ===== LANDING CONTAINER ===== */
        .landing-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }

        /* ===== LOGO ===== */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 1rem;
            animation: fadeInDown 1s ease forwards;
        }

        .logo-icon { font-size: 3.5rem; }

        .logo span {
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradientMove 4s ease-in-out infinite alternate;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .logo-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* ===== HERO CONTENT ===== */
        .hero-content {
            max-width: 700px;
            animation: fadeInUp 1s ease forwards;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1.2rem;
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 50px;
            font-size: 0.8rem;
            color: #667eea;
            font-weight: 500;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
            animation: fadeInUp 1s ease 0.2s forwards;
            opacity: 0;
        }

        .hero-badge .badge-dot {
            width: 6px;
            height: 6px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulseDot 1.5s ease-in-out infinite;
        }

        .hero-content h1 {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1.08;
            margin-bottom: 1.5rem;
            letter-spacing: -1.5px;
            animation: fadeInUp 1s ease 0.3s forwards;
            opacity: 0;
        }

        .hero-content h1 .gradient-text {
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradientMove 4s ease-in-out infinite alternate;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            max-width: 520px;
            margin: 0 auto 2.5rem;
            animation: fadeInUp 1s ease 0.5s forwards;
            opacity: 0;
        }

        /* ===== GET STARTED BUTTON ===== */
        .btn-get-started {
            padding: 1rem 3.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #ffffff;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.25);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            animation: fadeInUp 1s ease 0.7s forwards;
            opacity: 0;
        }

        .btn-get-started:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.45);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .btn-get-started .arrow {
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .btn-get-started:hover .arrow {
            transform: translateX(8px);
        }

        /* ===== FLOATING DECORATIONS ===== */
        .floating-icons {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            font-size: 3rem;
            opacity: 0.1;
            animation: floatIcon 10s ease-in-out infinite;
        }

        .floating-icons:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .floating-icons:nth-child(2) { top: 20%; right: 8%; animation-delay: 2s; font-size: 4rem; }
        .floating-icons:nth-child(3) { bottom: 25%; left: 8%; animation-delay: 4s; }
        .floating-icons:nth-child(4) { bottom: 15%; right: 5%; animation-delay: 1s; font-size: 3.5rem; }
        .floating-icons:nth-child(5) { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12rem; opacity: 0.03; animation: none; }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .landing-container { padding: 3rem 1.5rem; }
            
            .logo { font-size: 2rem; }
            .logo-icon { font-size: 2.5rem; }
            .logo-dot { width: 8px; height: 8px; }

            .hero-content h1 { font-size: 2.8rem; }
            .hero-content p { font-size: 1rem; max-width: 100%; }

            .btn-get-started { 
                padding: 0.8rem 2.5rem; 
                font-size: 1rem; 
                width: 100%;
                justify-content: center;
            }

            .floating-icons { display: none; }
        }

        @media (max-width: 480px) {
            .hero-content h1 { font-size: 2.2rem; }
            
            .btn-get-started { 
                padding: 0.7rem 2rem; 
                font-size: 0.95rem; 
            }
        }
    </style>
</head>
<body>

    <!-- ===== ANIMATED BACKGROUND ===== -->
    <canvas id="particles-canvas"></canvas>
    <div class="glow-overlay"></div>
    <div class="grid-overlay"></div>

    <!-- ===== FLOATING DECORATIONS ===== -->
    <span class="floating-icons">👕</span>
    <span class="floating-icons">👗</span>
    <span class="floating-icons">👔</span>
    <span class="floating-icons">👠</span>
    <span class="floating-icons">✦</span>

    <!-- ===== LANDING CONTENT ===== -->
    <div class="landing-container">
        
        <!-- Logo -->
        <div class="logo">
            <span class="logo-icon">🏪</span>
            <span>STORE</span>
            <span class="logo-dot"></span>
        </div>

        <!-- Hero -->
        <div class="hero-content">
            <div class="hero-badge">
                <span class="badge-dot"></span>
                Premium Quality Since 2026
            </div>

            <h1>
                Welcome to<br>
                <span class="gradient-text">STORE</span>
            </h1>

            <p>
                Discover premium clothing and accessories crafted for style and comfort. 
                Quality you can trust, prices you'll love.
            </p>

            <button class="btn-get-started" onclick="goToStore()">
                Get Started
                <span class="arrow">→</span>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ===== SCRIPTS ===== -->
    <!-- ============================================================ -->
    <script>
        // ===== PARTICLES =====
        (function() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 80;
            const CONNECTION_DISTANCE = 150;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 2 + 1;
                    this.speedX = (Math.random() - 0.5) * 0.5;
                    this.speedY = (Math.random() - 0.5) * 0.5;
                    this.opacity = Math.random() * 0.5 + 0.2;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > width) this.speedX *= -1;
                    if (this.y < 0 || this.y > height) this.speedY *= -1;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(102, 126, 234, ${this.opacity})`;
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push(new Particle());
                }
            }

            function drawConnections() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < CONNECTION_DISTANCE) {
                            const opacity = (1 - distance / CONNECTION_DISTANCE) * 0.2;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(102, 126, 234, ${opacity})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update(); p.draw(); });
                drawConnections();
                requestAnimationFrame(animate);
            }

            initParticles();
            animate();

            window.addEventListener('resize', () => {
                resize();
                initParticles();
            });
        })();

        // ===== GO TO STORE =====
        function goToStore() {
            // Add click animation
            const btn = document.querySelector('.btn-get-started');
            btn.style.transform = 'scale(0.95)';
            btn.style.opacity = '0.5';
            
            setTimeout(() => {
                window.location.href = '/index.html';
            }, 300);
        }

        // ===== KEYBOARD SUPPORT =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                goToStore();
            }
        });

        console.log('✅ Landing page loaded - Click "Get Started" to enter the store');
    </script>

</body>
</html>
